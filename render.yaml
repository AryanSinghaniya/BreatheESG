services:
  - type: web
    name: breathe-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.wsgi:application --chdir backend
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-db
          property: connectionString
  - type: static site
    name: breathe-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install ; npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
databases:
  - name: breathe-db
    plan: free
